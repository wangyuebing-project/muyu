<div class="stats"><div class="stat"><span>此刻功德</span><strong id="session">0</strong></div><div class="divider"></div><div class="stat secondary"><span>累计功德</span><strong id="total">0</strong></div></div>
<section class="controls" aria-label="敲击设置"><div class="row"><div><div class="control-title">自在敲击</div><div class="control-sub" id="autoHint">开启自动节奏，闭目片刻</div></div><button class="switch" id="auto" role="switch" aria-checked="false" aria-label="自动敲击"></button></div><div class="settings"><div class="setting"><label for="tempo">敲击节奏 <output id="tempoOut">60 次 / 分</output></label><input type="range" id="tempo" min="30" max="120" step="5" value="60"></div><div class="setting"><label for="volume">木鱼音量 <output id="volumeOut">65%</output></label><input type="range" id="volume" min="0" max="100" value="65"></div></div></section>
<div class="bottom-row"><button class="chip" id="reset">重新计数</button></div>
<p class="quote" id="quote">不必追赶什么，此刻就很好。</p><p class="foot">声音随心 · 记录留在此设备 · 离线也能安心敲</p></main>
<div class="toast" id="toast" role="status"></div><dialog id="resetDialog"><h2>让此刻，重新开始</h2><p>本次功德将归零，累计功德会保留。</p><div class="row"><button class="chip" id="cancelReset">再坐一会</button><button class="chip" id="confirmReset">重新开始</button></div></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,formatCount=new Intl.NumberFormat('zh-CN');
let saved={};try{saved=JSON.parse(localStorage.getItem('yinian-v1')||'{}')||{}}catch(e){}
let total=Number.isSafeInteger(saved.total)&&saved.total>=0?saved.total:0,session=0,sound=saved.sound!==false,auto=false,timer=null,lastHit=0,lastVibration=0,toastTimer,saveTimer,renderFrame,burstTimer,burstCount=0;
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
let audioContext,audioGain,audioBuffer,audioUnlocking,audioDecode,audioFailed=!AudioContextClass;
const fallbackSound=new Audio('muyu-hit.wav');fallbackSound.preload='auto';
const audioData=fetch('muyu-hit.wav',{cache:'force-cache'}).then(response=>{if(!response.ok)throw new Error('audio load failed');return response.arrayBuffer()}).catch(()=>null);
function persist(){try{localStorage.setItem('yinian-v1',JSON.stringify({total,sound,night:document.body.classList.contains('dark'),tempo:+$('tempo').value,volume:+$('volume').value}))}catch(e){}}
function saveSoon(){if(saveTimer)return;saveTimer=setTimeout(()=>{saveTimer=null;persist()},800)}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function playFallback(volume){fallbackSound.pause();fallbackSound.currentTime=0;fallbackSound.volume=volume;fallbackSound.play().catch(()=>{})}
function startAudio(volume){if(!audioContext||!audioBuffer)return;audioGain.gain.setValueAtTime(volume,audioContext.currentTime);const source=audioContext.createBufferSource();source.buffer=audioBuffer;source.connect(audioGain);source.onended=()=>source.disconnect();source.start()}
function createAudio(){if(audioContext||audioFailed)return;try{try{audioContext=new AudioContextClass({latencyHint:'interactive'})}catch(e){audioContext=new AudioContextClass()}audioGain=audioContext.createGain();audioGain.connect(audioContext.destination)}catch(e){audioFailed=true}}
function decodeAudio(){if(audioBuffer)return Promise.resolve(audioBuffer);if(!audioDecode)audioDecode=audioData.then(data=>data?audioContext.decodeAudioData(data):null).then(buffer=>{if(!buffer)throw new Error('audio decode failed');audioBuffer=buffer;return buffer});return audioDecode}
function play(){const volume=+$('volume').value/100;if(!sound||volume===0)return;createAudio();if(audioFailed){playFallback(volume);return}const resume=audioContext.state==='running'?Promise.resolve():audioContext.resume();if(audioBuffer){resume.then(()=>startAudio(volume)).catch(()=>{audioFailed=true;playFallback(volume)});return}if(!audioUnlocking)audioUnlocking=Promise.all([resume,decodeAudio()]).then(()=>startAudio(volume)).catch(()=>{audioFailed=true;playFallback(volume)}).finally(()=>{audioUnlocking=null})}
function renderCounts(){if(renderFrame)return;renderFrame=requestAnimationFrame(()=>{renderFrame=null;$('session').textContent=formatCount.format(session);$('total').textContent=formatCount.format(total)})}
let woodAnimation,malletAnimation,feedbackAnimation,rippleAnimation;
if(!reduce){woodAnimation=$('woodBody').animate([{transform:'scale(1)',transformOrigin:'200px 220px'},{transform:'scale(1.025,.955)',transformOrigin:'200px 220px',offset:.2},{transform:'scale(1)',transformOrigin:'200px 220px'}],{duration:330,easing:'cubic-bezier(.2,.8,.3,1)'});malletAnimation=$('mallet').animate([{transform:'rotate(0deg)'},{transform:'rotate(-27deg)',offset:.23},{transform:'rotate(0deg)'}],{duration:280,easing:'ease-out'});feedbackAnimation=$('hitFeedback').animate([{opacity:0,transform:'translate(-50%,8px)'},{opacity:.9,transform:'translate(-50%,0)',offset:.16},{opacity:.85,transform:'translate(-50%,-18px)',offset:.62},{opacity:0,transform:'translate(-50%,-58px)'}],{duration:700,easing:'ease-out'});rippleAnimation=$('hitRipple').animate([{transform:'translate(-50%,-50%) scale(.72)',opacity:.32},{transform:'translate(-50%,-50%) scale(1.7)',opacity:0}],{duration:620,easing:'ease-out'});[woodAnimation,malletAnimation,feedbackAnimation,rippleAnimation].forEach(animation=>animation.cancel())}
function restart(animation){animation.cancel();animation.play()}
function animateStrike(){burstCount++;$('hitFeedback').textContent='功德 +'+burstCount;clearTimeout(burstTimer);burstTimer=setTimeout(()=>{burstCount=0},320);restart(woodAnimation);restart(malletAnimation);restart(feedbackAnimation);restart(rippleAnimation)}
function strike(manual=true){const time=performance.now();if(time-lastHit<70)return;lastHit=time;session++;total++;renderCounts();play();saveSoon();if(!reduce)animateStrike();if(manual&&navigator.vibrate&&time-lastVibration>120){lastVibration=time;navigator.vibrate(8)}if(session%20===0){const quotes=['把心放慢，世界也会安静一点。','一呼一吸之间，回到当下。','念起即觉，觉之即安。','不必追赶什么，此刻就很好。'];$('quote').textContent=quotes[(session/20-1)%quotes.length]}}
function schedule(){clearInterval(timer);if(auto)timer=setInterval(()=>strike(false),60000/+$('tempo').value)}
function setAuto(value){auto=value;$('auto').setAttribute('aria-checked',String(auto));$('autoHint').textContent=auto?'正在轻敲，随时可以停下来':'开启自动节奏，闭目片刻';schedule()}
function updateSound(){ $('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'关闭声音':'开启声音');$('sound').title=sound?'关闭声音':'开启声音';$('sound').style.opacity=sound?'1':'.45'}
const wood=$('wood');wood.addEventListener('click',e=>{e.preventDefault();strike()});wood.addEventListener('dblclick',e=>e.preventDefault());wood.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('focus');return}if(e.code!=='Space'||e.repeat||$('resetDialog').open)return;if(/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)||e.target.isContentEditable)return;e.preventDefault();strike()});
$('auto').onclick=()=>{setAuto(!auto);if(auto)strike(false)};
$('tempo').oninput=()=>{$('tempoOut').textContent=$('tempo').value+' 次 / 分';schedule();saveSoon()};
$('volume').oninput=()=>{$('volumeOut').textContent=$('volume').value+'%';saveSoon()};
$('sound').onclick=()=>{sound=!sound;updateSound();persist();toast(sound?'木鱼声已开启':'声音已关闭')};
$('theme').onclick=()=>{const night=document.body.classList.toggle('dark');$('theme').setAttribute('aria-pressed',String(night));document.querySelector('meta[name="theme-color"]').content=night?'#202720':'#f5f1e9';persist()};
$('focus').onclick=()=>{document.body.classList.add('focus');$('exitFocus').focus()};$('exitFocus').onclick=()=>{document.body.classList.remove('focus');$('focus').focus()};
$('reset').onclick=()=>{setAuto(false);$('resetDialog').showModal()};$('cancelReset').onclick=()=>$('resetDialog').close();$('confirmReset').onclick=()=>{session=0;renderCounts();$('resetDialog').close();toast('新的一刻，慢慢来')};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(auto){setAuto(false);toast('已暂停自动敲击')}persist()}});window.addEventListener('pagehide',persist);
$('total').textContent=formatCount.format(total);if(Number.isFinite(saved.tempo))$('tempo').value=Math.max(30,Math.min(120,saved.tempo));if(Number.isFinite(saved.volume))$('volume').value=Math.max(0,Math.min(100,saved.volume));$('tempoOut').textContent=$('tempo').value+' 次 / 分';$('volumeOut').textContent=$('volume').value+'%';if(saved.night){document.body.classList.add('dark');$('theme').setAttribute('aria-pressed','true');document.querySelector('meta[name="theme-color"]').content='#202720'}updateSound();
})();
</script></body></html>
